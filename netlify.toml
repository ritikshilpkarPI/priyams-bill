[build]
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[dev]
  framework = "#custom"
  command = "npm run serve:server"
  port = 9000
  targetPort = 9001

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/*"
  status = 200

[[redirects]]
  from = "*"
  to = "index.html"
  status = 200

