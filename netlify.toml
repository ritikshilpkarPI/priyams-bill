[build]
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[dev]
  framework = "#custom"
  command = "npm run start:server"
  targetPort = 9001
  port = 9000

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:app"
  status = 200

[[redirects]]
  from = "/*"
  to = "index.html"
  status = 200

